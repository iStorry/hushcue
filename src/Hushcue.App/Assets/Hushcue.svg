<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The app icon as a vector, sharp at any size; the same drawing as tools/make-icon.ps1 makes for Hushcue.ico -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C8CFF" />
      <stop offset="1" stop-color="#5662D6" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)" />
  <!-- a speech "wave" above two subtitle lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="14" stroke-linecap="round">
    <line x1="88" y1="82" x2="88" y2="106" />
    <line x1="114" y1="66" x2="114" y2="106" />
    <line x1="140" y1="74" x2="140" y2="106" />
    <line x1="166" y1="88" x2="166" y2="106" />
  </g>
  <rect x="52" y="132" width="152" height="30" rx="15" fill="#FFFFFF" />
  <rect x="80" y="176" width="96" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.78" />
</svg>
